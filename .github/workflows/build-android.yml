name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            openjdk-17-jdk \
            pkg-config \
            libtinfo5 \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython<3"

      - name: Build debug APK
        run: buildozer -v android debug
        env:
          P4A_BUILD_DIR: ${{ github.workspace }}/.buildozer/android/platform/build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajaregistradora-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
