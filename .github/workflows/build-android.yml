name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            openjdk-17-jdk \
            pkg-config \
            curl \
            unzip \
            zip \
            zlib1g-dev
          if apt-cache show libtinfo5 >/dev/null 2>&1; then
            sudo apt-get install -y libtinfo5
          else
            sudo apt-get install -y libtinfo6
          fi

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          sdk_root="${GITHUB_WORKSPACE}/android-sdk"
          cmdline_tools_version="11076708"
          mkdir -p "${sdk_root}/cmdline-tools"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${cmdline_tools_version}_latest.zip" \
            --output /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "${sdk_root}/cmdline-tools"
          mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
          export PATH="${sdk_root}/cmdline-tools/latest/bin:${sdk_root}/platform-tools:${sdk_root}/build-tools/31.0.0:${PATH}"
          printf 'JAVA_HOME=%s\nANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "${JAVA_HOME}" "${sdk_root}" "${sdk_root}" >> "${GITHUB_ENV}"
          printf '%s\n' \
            "${sdk_root}/cmdline-tools/latest/bin" \
            "${sdk_root}/platform-tools" \
            "${sdk_root}/build-tools/31.0.0" >> "${GITHUB_PATH}"
          yes | sdkmanager --sdk_root="${sdk_root}" --licenses >/dev/null
          sdkmanager --sdk_root="${sdk_root}" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"
          test -x "${sdk_root}/build-tools/31.0.0/aidl"
          command -v aidl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython<3"

      - name: Build debug APK
        run: buildozer -v android debug
        env:
          P4A_BUILD_DIR: ${{ github.workspace }}/.buildozer/android/platform/build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajaregistradora-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
