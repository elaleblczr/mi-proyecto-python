name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Android build dependencies
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            openjdk-17-jdk \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev
          if apt-cache show libtinfo5 >/dev/null 2>&1; then
            sudo apt-get install -y libtinfo5
          else
            sudo apt-get install -y libtinfo6
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test "${JAVA_HOME}" != ""
          case "$(java -version 2>&1)" in
            *'"17.'*) ;;
            *) echo "Java 17 is required"; exit 1 ;;
          esac

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: ""
          accept-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          java -version
          printf 'JAVA_HOME=%s\nANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "${JAVA_HOME}" "${ANDROID_HOME}" "${ANDROID_HOME}" >> "${GITHUB_ENV}"
          printf '%s\n' \
            "${ANDROID_HOME}/cmdline-tools/latest/bin" \
            "${ANDROID_HOME}/platform-tools" \
            "${ANDROID_HOME}/build-tools/31.0.0" >> "${GITHUB_PATH}"
          printf 'y\n%.0s' {1..200} | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses >/dev/null
          sdkmanager --sdk_root="${ANDROID_HOME}" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"
          test -x "${ANDROID_HOME}/build-tools/31.0.0/aidl"
          command -v aidl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython<3"

      - name: Build debug APK
        run: buildozer -v android debug
        env:
          P4A_BUILD_DIR: ${{ github.workspace }}/.buildozer/android/platform/build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajaregistradora-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
